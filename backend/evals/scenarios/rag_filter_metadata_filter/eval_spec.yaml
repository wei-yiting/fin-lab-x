name: rag_filter_metadata_filter
status: draft
csv: dataset.csv
regression:
  # One-shot A/B experiment arm; ticker filter makes precision a tautology
  # (always 1.0), so there is nothing meaningful to gate on.
  enabled: false
task:
  function: backend.evals.eval_tasks.run_rag_filter_metadata_filter
pre_run:
  function: backend.evals.eval_tasks.pre_run_rag_filter
column_mapping:
  question: input.question
  target_ticker: input.target_ticker
  target_entity_zh: input.target_entity_zh
scorers:
  - name: ticker_precision_at_5
    function: backend.evals.scenarios.rag_filter_metadata_filter.scorer.ticker_precision_at_5
  - name: ticker_precision_at_10
    function: backend.evals.scenarios.rag_filter_metadata_filter.scorer.ticker_precision_at_10
