version: "0.1.0"
name: "ablation-luna-medium-plus-search"
description: "Prompt x tool 2x2, cell C (tool effect only): luna_medium's exact model/constraints and canonical benchmark prompt, plus sec_filing_search. No prompt file here — the run spec injects ../../prompt/system_prompt.md via ProfileConfigLoader.load_from_dir(prompt_path=...)."

tools:
  - finnhub_stock_quote
  - finnhub_company_basic_financials
  - tavily_financial_search
  - sec_filing_list_sections
  - sec_filing_get_section
  - sec_filing_search

model:
  name: "openai:gpt-5.6-luna"
  temperature: 0.0
  reasoning: "on"
  reasoning_effort: "medium"

constraints:
  max_tool_calls_per_run: 10
