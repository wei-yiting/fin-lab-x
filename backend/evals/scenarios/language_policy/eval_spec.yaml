name: language_policy
csv: dataset.csv

regression:
  enabled: true

task:
  function: backend.evals.eval_tasks.run_profile

column_mapping:
  prompt: input
  prompt_language: metadata.prompt_language
  ticker: expected.ticker
  expect_tool: expected.tool
  expect_search_query_no_cjk: expected.search_query_no_cjk
  expect_response_cjk_min: expected.cjk_min
  expect_response_cjk_max: expected.cjk_max

scorers:
  - name: tool_arg_no_cjk
    function: backend.evals.scenarios.language_policy.scorer.tool_arg_no_cjk
  - name: response_language
    function: backend.evals.scenarios.language_policy.scorer.response_language
  - name: expected_tool_called
    function: backend.evals.scenarios.language_policy.scorer.expected_tool_called
