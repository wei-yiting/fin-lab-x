version: "0.1.0"
name: "benchmark-c1-luna-none"
description: "DEV-200 benchmark candidate C1: same-family fast/minimal-reasoning arm (openai:gpt-5.6-luna, reasoning.effort=none) vs C2's reasoning-enabled arm. No prompt file here — ProfileConfigLoader.load_from_dir() injects the single canonical shared prompt from ../../prompt/system_prompt.md."

tools:
  - finnhub_stock_quote
  - finnhub_company_basic_financials
  - tavily_financial_search
  - sec_filing_list_sections
  - sec_filing_get_section

model:
  name: "openai:gpt-5.6-luna"
  temperature: 0.0
  reasoning: "on"
  reasoning_effort: "none"

constraints:
  max_tool_calls_per_run: 10
