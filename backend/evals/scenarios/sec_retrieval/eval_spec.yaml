name: sec_retrieval
status: draft
csv: dataset.csv
regression:
  # Metrics have no measured baseline yet (status: draft — hand-written
  # placeholder dataset). Flipping to true and setting metric_floor values
  # from a measured baseline belongs to DEV-103.
  enabled: false
task:
  function: backend.evals.eval_tasks.run_sec_retrieval
pre_run:
  function: backend.evals.eval_tasks.pre_run_sec_retrieval
column_mapping:
  question: input.question
  expected_header_paths: expected.header_paths
  expected_tickers: expected.tickers
  match_mode: expected.match_mode
  answer_snippets: expected.answer_snippets
  query_type: metadata.query_type
column_types:
  expected_header_paths: json
  expected_tickers: json
  answer_snippets: json
scorers:
  - name: header_path_recall_at_5
    function: backend.evals.scenarios.sec_retrieval.scorer.header_path_recall_at_5
  - name: header_path_recall_at_10
    function: backend.evals.scenarios.sec_retrieval.scorer.header_path_recall_at_10
  - name: mrr
    function: backend.evals.scenarios.sec_retrieval.scorer.mean_reciprocal_rank
  - name: map
    function: backend.evals.scenarios.sec_retrieval.scorer.mean_average_precision
