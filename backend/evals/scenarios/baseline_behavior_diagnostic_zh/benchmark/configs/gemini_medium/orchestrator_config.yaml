version: "0.1.0"
name: "benchmark-gemini-medium"
description: "Cross-provider reasoning-enabled arm (google_genai:gemini-3.6-flash, thinking_level=medium, the API default) vs gemini_minimal's minimal-reasoning arm. No prompt file here — ProfileConfigLoader.load_from_dir() injects the single canonical shared prompt from ../../prompt/system_prompt.md."

tools:
  - finnhub_stock_quote
  - finnhub_company_basic_financials
  - tavily_financial_search
  - sec_filing_list_sections
  - sec_filing_get_section

model:
  name: "google_genai:gemini-3.6-flash"
  temperature: 0.0
  reasoning: "on"
  reasoning_effort: "medium"

constraints:
  max_tool_calls_per_run: 10
