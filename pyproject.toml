[project]
name = "finlab-x-backend"
version = "0.1.0"
description = "FinLab-X backend services and AI engine"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "duckdb>=1.0.0",
    "edgartools>=5.17.1",
    "fastapi>=0.115.0",
    "finnhub-python>=2.4.28",
    "html-to-markdown>=3.0.2,<4.0.0",
    "langchain>=1.2.10",
    "langchain-anthropic>=0.4.0",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=1.1.10",
    "langchain-text-splitters>=0.3.0",
    "langfuse>=4.5.0",
    "langgraph>=0.5.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "llama-index-core>=0.12.0",
    "llama-index-embeddings-openai>=0.3.0",
    "llama-index-vector-stores-qdrant>=0.4.0",
    "markdownify>=1.2.0",
    "openai>=2.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.2",
    "qdrant-client>=1.12.0",
    "tavily-python>=0.7.21",
    "tenacity>=9.0.0",
    "tiktoken>=0.9.0",
    "uvicorn>=0.41.0",
    "yfinance>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "autoevals>=0.1.0",
    "braintrust>=0.30.0",
    "httpx>=0.28.0",
    "litellm>=1.83.10",
    "numpy>=1.26.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.9.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
markers = [
    "eval: evaluation tests that hit real LLM APIs",
    "integration: integration tests requiring external services (Qdrant, etc.)",
    "sec_integration: SEC integration tests that hit real SEC EDGAR APIs",
    "finnhub_integration: Finnhub integration tests that hit the real Finnhub free API",
]
addopts = "-m 'not eval and not sec_integration and not integration and not finnhub_integration'"

[tool.ruff]
line-length = 88

[tool.pyright]
# Narrow adoption: the checker guards live backend source, and everything it
# would only produce noise on is excluded deliberately. Each exclusion below
# states what would have to change for it to be lifted.
include = ["backend"]
exclude = [
    "**/__pycache__",
    # Test doubles are not the types they stand in for (a FakeTenK is not a
    # TenK, a @tool object is not statically callable), and fixtures unpack
    # heterogeneous JSON dicts as **kwargs. Holding them to the checker's
    # standard would mean TypedDicts and casts scattered through the suite —
    # noise traded for a green tick. Revisit if a type error ever survives
    # into production because only the tests would have caught it.
    "backend/tests",
    # Frozen A/B baseline: AGENTS.md forbids touching these, and the sunset PR
    # deletes them wholesale. Delete these two lines with the tree.
    "backend/ingestion/sec_filing_pipeline_html",
    "backend/ingestion/sec_dense_pipeline_html",
    # Frozen data contract for the same A/B experiment: public signatures and
    # data-path behaviour must not move while the baseline lives. Its errors
    # come from an upstream signature that is wider than the call sites
    # (edgartools' filings.latest()). Drop this line at sunset too.
    "backend/common/sec_core.py",
]
# Pin the checker to `requires-python` rather than to whatever interpreter
# happens to be active (CI installs 3.13).
pythonVersion = "3.11"
# `standard` is the currently enforced baseline; AGENTS.md §3.1's "strict typing
# is mandatory" is an authoring convention (annotate everything), not pyright's
# `strict` mode.
typeCheckingMode = "standard"

[dependency-groups]
dev = [
    "pyright>=1.1.408",
]
